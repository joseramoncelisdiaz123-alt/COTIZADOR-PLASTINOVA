<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plastinova | Cotizador Pro 2.2</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090a0f">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        /* === ESTÉTICA NEÓN PLASTINOVA === */
        :root {
            --fondo-oscuro: #090a0f;
            --neon-azul: #00f3ff; 
            --neon-morado: #bc13fe; 
            --cristal: rgba(255, 255, 255, 0.05);
            --borde-cristal: rgba(255, 255, 255, 0.1);
            --texto-claro: #e0e6ed;
            --soldadura: #ffcc00; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--fondo-oscuro); color: var(--texto-claro); padding: 20px; padding-bottom: 90px; background-image: radial-gradient(circle at 50% -20%, rgba(0, 243, 255, 0.15), transparent 50%); min-height: 100vh; overflow-x: hidden; }

        /* CHISPAS */
        .chispa { position: fixed; pointer-events: none; z-index: 0; background: var(--soldadura); border-radius: 50%; box-shadow: 0 0 8px var(--soldadura), 0 0 15px #ff9900; opacity: 0; }
        @keyframes volarChispa { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dir-x), var(--dir-y)) scale(0.2); } }

        header { text-align: center; margin-bottom: 20px; z-index: 10; position: relative; }
        .logo-img { max-width: 180px; filter: drop-shadow(0 0 10px rgba(0,243,255,0.3)); margin-bottom: 10px; }
        h1 { font-size: 24px; letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px var(--neon-azul); }
        h2 { font-size: 11px; color: var(--neon-morado); letter-spacing: 4px; margin-top: 5px; }

        .panel { background: var(--cristal); border: 1px solid var(--borde-cristal); border-radius: 20px; padding: 20px; width: 100%; max-width: 450px; margin: 0 auto 20px auto; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .pantalla { display: none; animation: fadeIn 0.3s ease; }
        .pantalla.activa { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(9, 10, 15, 0.9); backdrop-filter: blur(15px); border-top: 1px solid var(--borde-cristal); display: flex; justify-content: space-around; padding: 15px 10px 25px 10px; z-index: 100; }
        .tab-btn { background: none; border: none; color: #8b9bb4; font-size: 12px; font-weight: bold; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .tab-btn.activo { color: var(--neon-azul); }

        .grupo-input { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: #8b9bb4; margin-bottom: 6px; text-transform: uppercase; }
        select, input[type="number"], input[type="text"] { width: 100%; background-color: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 243, 255, 0.3); color: #ffffff; padding: 12px; border-radius: 12px; font-size: 15px; outline: none; }
        
        .btn-micro { background: rgba(188, 19, 254, 0.1); border: 1px solid var(--neon-morado); color: var(--neon-morado); padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .btn-micro.activo-porcentaje { background: rgba(0, 243, 255, 0.1); border-color: var(--neon-azul); color: var(--neon-azul); }

        .btn-neon { width: 100%; padding: 14px; background: rgba(0,0,0,0.4); color: var(--neon-azul); font-size: 14px; font-weight: bold; text-transform: uppercase; border: 2px solid var(--neon-azul); border-radius: 12px; cursor: pointer; margin-top: 10px; }
        .btn-secundario { border-color: var(--neon-morado); color: var(--neon-morado); }
        .btn-pdf { border-color: #2ecc71; color: #2ecc71; }
        
        .btn-accion-pequeno { background: transparent; border: 1px solid var(--neon-azul); color: var(--neon-azul); padding: 8px 15px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-top: 8px; }

        #lista-carrito { list-style: none; margin-bottom: 15px; font-size: 13px; }
        #lista-carrito li { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--neon-azul); position: relative;}
        .btn-eliminar { position: absolute; right: 10px; top: 10px; color: #ff3366; background: none; border: none; font-size: 18px; cursor: pointer;}
        
        .totales-caja { background: rgba(188, 19, 254, 0.1); padding: 15px; border-radius: 12px; border: 1px solid rgba(188, 19, 254, 0.3); }
        .fila-total { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; }
        .gran-total { font-size: 18px; font-weight: bold; color: var(--neon-azul); margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }

        .tarjeta-historial { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid var(--neon-morado); }
    </style>
</head>
<body>

    <header>
        <img src="logo.jpeg" alt="Logo Plastinova" class="logo-img">
        <h1>Plastinova</h1>
        <h2>COTIZADOR PRO</h2>
    </header>

    <nav class="nav-bar">
        <button class="tab-btn activo" onclick="cambiarTab('cotizador')" id="tab-btn-cotizador"><span>✍️</span> Crear</button>
        <button class="tab-btn" onclick="cambiarTab('historial')" id="tab-btn-historial"><span>📁</span> Historial</button>
    </nav>

    <div id="pantalla-cotizador" class="pantalla activa">
        <div class="panel">
            <div class="grupo-input"><label>Nombre del Cliente</label><input type="text" id="inp-cliente" placeholder="Ej. Juan Pérez"></div>
            <div class="grupo-input"><label>Asesor</label><select id="sel-asesor"><option>Pedro</option><option>Fernando</option><option>Isidro</option><option>Ofelia</option><option>Ramón</option></select></div>
        </div>

        <main class="panel">
            <div class="grupo-input"><label>Producto</label><select id="sel-tipo"><option value="tinaco">Tinacos (Tricapa)</option><option value="tambo">Tambos (Bicapa)</option></select></div>
            <div style="display: flex; gap: 10px;">
                <div class="grupo-input" style="flex: 1;"><label>Capacidad</label><select id="sel-capacidad"></select></div>
                <div class="grupo-input" style="flex: 1;"><label>Color</label><select id="sel-color"></select></div>
            </div>
            <input type="text" id="inp-color-otro" placeholder="Escribe el color..." style="display: none; margin-bottom: 15px; border-color: var(--neon-morado);">
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; font-size:12px;">
                <span>MAYOREO BASE</span>
                <input type="checkbox" id="check-mayoreo" style="width:22px; height:22px;">
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div class="grupo-input" style="flex: 1;"><label>Precio Base</label><input type="number" id="inp-precio-base" disabled></div>
                <div class="grupo-input" style="flex: 1;">
                    <div style="display: flex; justify-content: space-between;"><label>Desc.</label><button id="btn-tipo-desc" class="btn-micro">[ $ ] Fijo</button></div>
                    <input type="number" id="inp-descuento" value="0">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="grupo-input" style="flex: 1;"><label>Cantidad</label><input type="number" id="inp-cantidad" value="1"></div>
                <div class="grupo-input" style="flex: 2;"><label style="color: var(--neon-azul);">Precio Neto Unitario</label><input type="number" id="inp-precio-final" style="font-weight: bold; color: var(--neon-azul);"></div>
            </div>
            <button class="btn-neon" id="btn-agregar">+ AGREGAR AL CARRITO</button>
        </main>

        <section class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; font-size:12px; color:var(--neon-morado);">
                <span>COTIZAR CON IVA (16%)</span>
                <input type="checkbox" id="check-iva" style="width:22px; height:22px;">
            </div>
            <ul id="lista-carrito"></ul>
            <div class="totales-caja">
                <div class="fila-total"><span>Subtotal:</span> <span id="txt-subtotal">$0.00</span></div>
                <div class="fila-total" style="color: #ff3366;"><span>Ahorro:</span> <span id="txt-ahorro">-$0.00</span></div>
                <div class="fila-total"><span>IVA (16%):</span> <span id="txt-iva">$0.00</span></div>
                <div class="fila-total gran-total"><span>TOTAL:</span> <span id="txt-total">$0.00</span></div>
            </div>
            <button class="btn-neon btn-secundario" id="btn-compartir">WHATSAPP</button>
            <button class="btn-neon btn-pdf" id="btn-pdf">GENERAR PDF PROFESIONAL</button>
        </section>
    </div>

    <div id="pantalla-historial" class="pantalla"><div class="panel"><h3 style="text-align:center; margin-bottom:15px;">HISTORIAL</h3><div id="contenedor-historial"></div><button class="btn-neon" style="border-color:#ff3366;color:#ff3366;" onclick="limpiarHistorial()">Borrar todo</button></div></div>

    <script>
        // CHISPAS
        function crearChispa() {
            const c = document.createElement('div'); c.classList.add('chispa');
            c.style.left = Math.random()*100+'vw'; c.style.top = Math.random()*100+'vh';
            c.style.width = '3px'; c.style.height = '3px';
            c.style.setProperty('--dir-x', (Math.random()-0.5)*150+'px'); c.style.setProperty('--dir-y', Math.random()*150+'px');
            c.style.animation = `volarChispa 1.5s ease-in forwards`; document.body.appendChild(c); setTimeout(()=>c.remove(), 2000);
        } setInterval(crearChispa, 150);

        // DATA
        const db = {
            tambo: { capa: "Bicapa", capacidades: { "235L": { normal: 600, mayoreo: 550 } }, colores: ["Granito Beige", "Rojo", "Verde", "Azul", "Negro", "Blanco", "Café", "Azul/Blanco", "Rojo/Blanco", "Verde/Blanco", "Naranja/Blanco", "Terracota", "Oxford", "Natural"] },
            tinaco: { capa: "Tricapa", capacidades: { "750L": { normal: 1500, mayoreo: 1350 }, "1100L": { normal: 1600, mayoreo: 1400 }, "1200L": { normal: 1750, mayoreo: 1550 } }, colores: ["Beige", "Negro", "Rojo", "Azul", "Verde", "Naranja", "Café", "Blanco"] }
        };

        let carrito = []; let tipoDescuento = 'monto';
        let historialGuardado = JSON.parse(localStorage.getItem('plastinova_historial')) || [];

        const ui = {
            cliente: document.getElementById('inp-cliente'), asesor: document.getElementById('sel-asesor'),
            tipo: document.getElementById('sel-tipo'), capacidad: document.getElementById('sel-capacidad'),
            color: document.getElementById('sel-color'), colorOtro: document.getElementById('inp-color-otro'),
            mayoreo: document.getElementById('check-mayoreo'), base: document.getElementById('inp-precio-base'),
            desc: document.getElementById('inp-descuento'), btnDesc: document.getElementById('btn-tipo-desc'),
            final: document.getElementById('inp-precio-final'), cant: document.getElementById('inp-cantidad'), iva: document.getElementById('check-iva')
        };

        function actualizarForm() {
            const d = db[ui.tipo.value];
            ui.capacidad.innerHTML = Object.keys(d.capacidades).map(c=>`<option value="${c}">${c}</option>`).join('');
            ui.color.innerHTML = d.colores.map(c=>`<option value="${c}">${c}</option>`).join('') + `<option value="otro">Otro (Manual)...</option>`;
            actualizarPrecio();
        }

        ui.color.onchange = () => { ui.colorOtro.style.display = ui.color.value === 'otro' ? 'block' : 'none'; };

        function actualizarPrecio() {
            const v = db[ui.tipo.value].capacidades[ui.capacidad.value];
            ui.base.value = ui.mayoreo.checked ? v.mayoreo : v.normal;
            calcD();
        }

        ui.btnDesc.onclick = () => {
            tipoDescuento = tipoDescuento === 'monto' ? 'porcentaje' : 'monto';
            ui.btnDesc.innerText = tipoDescuento === 'monto' ? '[ $ ] Fijo' : '[ % ] Porcent.';
            ui.btnDesc.classList.toggle('activo-porcentaje', tipoDescuento === 'porcentaje');
            calcD();
        };

        function calcD() {
            let b = parseFloat(ui.base.value) || 0; let d = parseFloat(ui.desc.value) || 0;
            if(tipoDescuento === 'porcentaje') ui.final.value = (b - (b*(d/100))).toFixed(2);
            else ui.final.value = (b - d).toFixed(2);
        }

        ui.desc.oninput = calcD;
        ui.final.oninput = () => {
            let b = parseFloat(ui.base.value) || 0; let f = parseFloat(ui.final.value) || 0;
            if(tipoDescuento === 'monto') ui.desc.value = (b - f).toFixed(2);
            else ui.desc.value = (((b - f)/b)*100).toFixed(2);
        };

        ui.tipo.onchange = actualizarForm; ui.capacidad.onchange = actualizarPrecio; ui.mayoreo.onchange = actualizarPrecio; ui.iva.onchange = renderTotales;

        document.getElementById('btn-agregar').onclick = () => {
            const v = db[ui.tipo.value].capacidades[ui.capacidad.value];
            const col = ui.color.value === 'otro' ? ui.colorOtro.value : ui.color.value;
            carrito.push({
                id: Date.now(), nombre: `${ui.tipo.value.toUpperCase()} ${ui.capacidad.value} (${db[ui.tipo.value].capa})`,
                color: col || "N/A", cant: parseInt(ui.cant.value), pNormal: v.normal, pFinal: parseFloat(ui.final.value),
                ahorro: v.normal - parseFloat(ui.final.value), importe: parseFloat(ui.final.value) * parseInt(ui.cant.value)
            });
            renderCar();
        };

        function renderCar() {
            document.getElementById('lista-carrito').innerHTML = carrito.map(i => `<li><b>${i.cant}x</b> ${i.nombre}<br><span style="color:#8b9bb4;">Color: ${i.color}</span><br>Importe: $${i.importe.toFixed(2)}<button class="btn-eliminar" onclick="del(${i.id})">×</button></li>`).join('');
            renderTotales();
        }
        window.del = id => { carrito = carrito.filter(i=>i.id!==id); renderCar(); };

        let totalG = 0;
        function renderTotales() {
            let sO = 0, ah = 0, sN = 0;
            carrito.forEach(i => { sO += (i.pNormal * i.cant); ah += (i.ahorro * i.cant); sN += i.importe; });
            let iv = ui.iva.checked ? sN * 0.16 : 0; totalG = sN + iv;
            document.getElementById('txt-subtotal').innerText = `$${sO.toFixed(2)}`;
            document.getElementById('txt-ahorro').innerText = `-$${ah.toFixed(2)}`;
            document.getElementById('txt-iva').innerText = `$${iv.toFixed(2)}`;
            document.getElementById('txt-total').innerText = `$${totalG.toFixed(2)} MXN`;
        }

        // WHATSAPP
        document.getElementById('btn-compartir').onclick = () => {
            if(carrito.length === 0) return alert("Agregue productos.");
            const f = Math.floor(Math.random()*9000)+1000; const d = new Date().toLocaleDateString('es-MX');
            const c = ui.cliente.value || "Cliente General";
            let txt = `\uD83D\uDCA7 *COTIZACIÓN PLASTINOVA*\nFolio: *#${f}*\nFecha: ${d}\n-----------------------------------------\n\uD83D\uDC64 *Cliente:* ${c}\nAsesor: ${ui.asesor.value}\n-----------------------------------------\n\uD83D\uDCCB *DETALLE DE PRODUCTOS*\n\n`;
            let sO = 0, ah = 0, sN = 0;
            carrito.forEach(i => {
                txt += `\u25A0 *${i.cant}x | ${i.nombre}*\nColor: ${i.color}\n`;
                if(i.ahorro > 0) txt += `Precio Lista: $${i.pNormal.toFixed(2)}\n*Precio Aplicado:* $${i.pFinal.toFixed(2)} (Ahorro: $${i.ahorro.toFixed(2)} c/u)\n`;
                else txt += `Precio Unitario: $${i.pFinal.toFixed(2)}\n`;
                txt += `Importe: $${i.importe.toFixed(2)}\n\n`;
                sO += (i.pNormal*i.cant); ah += (i.ahorro*i.cant); sN += i.importe;
            });
            let iv = ui.iva.checked ? sN*0.16 : 0;
            txt += `-----------------------------------------\n\uD83D\uDCCA *TOTALES*\nSubtotal lista: $${sO.toFixed(2)}\nAhorro aplicado: -$${ah.toFixed(2)}\nSubtotal: $${sN.toFixed(2)}\nIVA (16%): $${iv.toFixed(2)}\n-----------------------------------------\n\u2705 *TOTAL A PAGAR: $${(sN+iv).toFixed(2)} MXN*\n-----------------------------------------\n_\uD83D\uDCB3 Métodos de pago: Efectivo y Transferencia._\n_\u26A0\uFE0F ${ui.iva.checked ? 'Cotización con IVA incluido.' : 'Si requiere factura, notifique para actualizar.'}_`;
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
            historialGuardado.unshift({ folio: f, fecha: d, cliente: c, asesor: ui.asesor.value, total: totalG, iva: ui.iva.checked, items: [...carrito] });
            localStorage.setItem('plastinova_historial', JSON.stringify(historialGuardado));
        };

        // PDF PROFESIONAL CORREGIDO (LOGO SEPARADO)
        document.getElementById('btn-pdf').onclick = () => {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            const cl = ui.cliente.value || "CLIENTE GENERAL";
            const f = Math.floor(Math.random()*9000)+1000;
            
            // Logo
            const logo = new Image(); logo.src = 'logo.jpeg';
            try { doc.addImage(logo, 'JPEG', 15, 8, 35, 18); } catch(e){}

            // TEXTO MOVIDO MUCHO MÁS A LA DERECHA (X=65) PARA EVITAR ENCIMARSE
            doc.setFontSize(22); doc.setTextColor(200, 30, 30); doc.text("PLASTINOVA", 65, 18);
            doc.setFontSize(10); doc.setTextColor(100); doc.text("SOLUCIONES EN ALMACENAMIENTO", 65, 24);
            
            doc.setTextColor(40); doc.text(`FOLIO: #${f}`, 195, 20, { align: 'right' });
            doc.text(`FECHA: ${new Date().toLocaleDateString()}`, 195, 26, { align: 'right' });
            
            doc.setFillColor(245, 247, 250); doc.roundedRect(15, 35, 180, 22, 2, 2, 'F');
            doc.setTextColor(0); doc.setFont(undefined, 'bold');
            doc.text("CLIENTE:", 20, 42); doc.text("ASESOR:", 120, 42);
            doc.setFont(undefined, 'normal'); doc.text(cl.toUpperCase(), 20, 50); doc.text(ui.asesor.value.toUpperCase(), 120, 50);

            const body = carrito.map(i => [i.cant, i.nombre, i.color, `$${i.pFinal.toFixed(2)}`, `$${i.importe.toFixed(2)}`]);
            doc.autoTable({ startY: 65, head: [['CANT', 'DESCRIPCIÓN', 'COLOR', 'PRECIO U.', 'IMPORTE']], body: body, theme: 'grid', headStyles: { fillColor: [20, 90, 160] } });
            
            const fY = doc.lastAutoTable.finalY + 10;
            doc.text("SUBTOTAL:", 140, fY); doc.text("$"+(totalG/(ui.iva.checked?1.16:1)).toFixed(2), 195, fY, { align: 'right' });
            doc.text("IVA (16%):", 140, fY + 8); doc.text("$"+(ui.iva.checked?totalG-(totalG/1.16):0).toFixed(2), 195, fY + 8, { align: 'right' });
            doc.setFontSize(13); doc.setFont(undefined, 'bold');
            doc.text("TOTAL:", 140, fY + 18); doc.text(`$${totalG.toFixed(2)} MXN`, 195, fY + 18, { align: 'right' });
            doc.save(`Cotizacion_${cl}.pdf`);
        };

        function cambiarTab(t) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(`pantalla-${t}`).classList.add('activa');
            if(t === 'historial') renderHist();
        }

        function renderHist() {
            document.getElementById('contenedor-historial').innerHTML = historialGuardado.map(c => `<div class="tarjeta-historial"><div style="display:flex; justify-content:space-between; font-weight:bold;"><span>#${c.folio}</span><span>$${c.total.toFixed(2)}</span></div><div style="font-size:12px; color:#8b9bb4; margin:5px 0;">${c.cliente} - ${c.fecha}</div><button class="btn-accion-pequeno" onclick="cargar(${c.folio})">✏️ Abrir y Editar</button></div>`).join('') || '<p style="text-align:center;">Vacio.</p>';
        }

        window.cargar = function(f) {
            const c = historialGuardado.find(i => i.folio === f); if(!c) return;
            ui.cliente.value = c.cliente; ui.asesor.value = c.asesor; ui.iva.checked = c.iva; carrito = [...c.items];
            renderCar(); cambiarTab('cotizador');
        };

        function limpiarHistorial() { if(confirm("¿Borrar?")) { localStorage.removeItem('plastinova_historial'); historialGuardado = []; renderHist(); } }
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); }); }
        actualizarForm();
    </script>
</body>
</html>
