<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plastinova | Cotizador Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090a0f">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --fondo-oscuro: #090a0f;
            --neon-azul: #00f3ff; 
            --neon-morado: #bc13fe; 
            --cristal: rgba(255, 255, 255, 0.05);
            --borde-cristal: rgba(255, 255, 255, 0.1);
            --texto-claro: #e0e6ed;
            --soldadura: #ffcc00; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--fondo-oscuro); color: var(--texto-claro); padding: 20px; padding-bottom: 90px; background-image: radial-gradient(circle at 50% -20%, rgba(0, 243, 255, 0.15), transparent 50%); min-height: 100vh; overflow-x: hidden; }

        .chispa { position: fixed; pointer-events: none; z-index: 0; background: var(--soldadura); border-radius: 50%; box-shadow: 0 0 8px var(--soldadura), 0 0 15px #ff9900; opacity: 0; }
        @keyframes volarChispa { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dir-x), var(--dir-y)) scale(0.2); } }

        header { text-align: center; margin-bottom: 20px; z-index: 10; position: relative; }
        .logo-img { max-width: 180px; filter: drop-shadow(0 0 10px rgba(0,243,255,0.3)); margin-bottom: 10px; }
        h1 { font-size: 24px; letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px var(--neon-azul); }
        h2 { font-size: 11px; color: var(--neon-morado); letter-spacing: 4px; margin-top: 5px; }

        .panel { background: var(--cristal); border: 1px solid var(--borde-cristal); border-radius: 20px; padding: 20px; width: 100%; max-width: 450px; margin: 0 auto 20px auto; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .pantalla { display: none; animation: fadeIn 0.3s ease; }
        .pantalla.activa { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(9, 10, 15, 0.9); backdrop-filter: blur(15px); border-top: 1px solid var(--borde-cristal); display: flex; justify-content: space-around; padding: 15px 10px 25px 10px; z-index: 100; }
        .tab-btn { background: none; border: none; color: #8b9bb4; font-size: 12px; font-weight: bold; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .tab-btn.activo { color: var(--neon-azul); }

        .grupo-input { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: #8b9bb4; margin-bottom: 6px; text-transform: uppercase; }
        select, input[type="number"], input[type="text"] { width: 100%; background-color: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 243, 255, 0.3); color: #ffffff; padding: 12px; border-radius: 12px; font-size: 15px; outline: none; }
        
        .switch-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 12px; color: #8b9bb4; font-weight: bold; text-transform: uppercase; }
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 3px; background-color: #8b9bb4; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: rgba(0, 243, 255, 0.1); border-color: var(--neon-azul); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--neon-azul); }
        
        .btn-micro { background: rgba(188, 19, 254, 0.1); border: 1px solid var(--neon-morado); color: var(--neon-morado); padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .btn-micro.activo-porcentaje { background: rgba(0, 243, 255, 0.1); border-color: var(--neon-azul); color: var(--neon-azul); }

        .btn-neon { width: 100%; padding: 14px; background: rgba(0,0,0,0.4); color: var(--neon-azul); font-size: 14px; font-weight: bold; text-transform: uppercase; border: 2px solid var(--neon-azul); border-radius: 12px; cursor: pointer; margin-top: 10px; }
        .btn-secundario { border-color: var(--neon-morado); color: var(--neon-morado); }
        .btn-pdf { border-color: #2ecc71; color: #2ecc71; }
        
        .btn-accion-pequeno { background: transparent; border: 1px solid var(--neon-azul); color: var(--neon-azul); padding: 8px 15px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-top: 8px; }

        #lista-carrito { list-style: none; margin-bottom: 15px; font-size: 13px; }
        #lista-carrito li { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--neon-azul); position: relative;}
        .btn-eliminar { position: absolute; right: 10px; top: 10px; color: #ff3366; background: none; border: none; font-size: 18px; cursor: pointer;}
        
        .totales-caja { background: rgba(188, 19, 254, 0.1); padding: 15px; border-radius: 12px; border: 1px solid rgba(188, 19, 254, 0.3); }
        .fila-total { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; }
        .gran-total { font-size: 18px; font-weight: bold; color: var(--neon-azul); margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }

        .tarjeta-historial { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid var(--neon-morado); }
        .tarjeta-historial .titulo { font-size: 15px; color: #fff; font-weight: bold; display: flex; justify-content: space-between; }
        .tarjeta-historial .detalle { font-size: 12px; color: #8b9bb4; margin: 8px 0; }
    </style>
</head>
<body>

    <header>
        <img src="logo.jpeg" alt="Logo Plastinova" class="logo-img">
        <h1>Plastinova</h1>
        <h2>COTIZADOR PRO</h2>
    </header>

    <nav class="nav-bar">
        <button class="tab-btn activo interactivo" onclick="cambiarTab('cotizador')" id="tab-btn-cotizador">
            <span style="font-size: 18px;">✍️</span> Crear
        </button>
        <button class="tab-btn interactivo" onclick="cambiarTab('historial')" id="tab-btn-historial">
            <span style="font-size: 18px;">📁</span> Historial
        </button>
    </nav>

    <div id="pantalla-cotizador" class="pantalla activa">
        
        <div class="panel" style="border-color: rgba(188, 19, 254, 0.4);">
            <div class="grupo-input">
                <label>Nombre del Cliente o Empresa</label>
                <input type="text" id="inp-cliente" placeholder="Ej. Juan Pérez">
            </div>
            <div class="grupo-input">
                <label>Asesor de Ventas</label>
                <select id="sel-asesor">
                    <option value="Pedro">Pedro</option>
                    <option value="Fernando">Fernando</option>
                    <option value="Isidro">Isidro</option>
                    <option value="Ofelia">Ofelia</option>
                    <option value="Ramón">Ramón</option>
                </select>
            </div>
        </div>

        <main class="panel">
            <div class="grupo-input">
                <label>Tipo de Producto</label>
                <select id="sel-tipo">
                    <option value="tinaco">Tinacos (Tricapa)</option>
                    <option value="tambo">Tambos (Bicapa)</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="grupo-input" style="flex: 1;">
                    <label>Capacidad</label>
                    <select id="sel-capacidad"></select>
                </div>
                <div class="grupo-input" style="flex: 1;">
                    <label>Color</label>
                    <select id="sel-color"></select>
                </div>
            </div>

            <input type="text" id="inp-color-otro" placeholder="Escribe el color especial..." style="display: none; margin-bottom: 15px; border-color: var(--neon-morado);">
            
            <div class="switch-container">
                <span>Aplicar Mayoreo base</span>
                <label class="switch">
                    <input type="checkbox" id="check-mayoreo">
                    <span class="slider"></span>
                </label>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div class="grupo-input" style="flex: 1; margin-bottom: 0;">
                    <label>Precio Base</label>
                    <input type="number" id="inp-precio-base" disabled>
                </div>
                <div class="grupo-input" style="flex: 1; margin-bottom: 0;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                        <label style="color: var(--neon-morado); margin: 0;">Descuento</label>
                        <button id="btn-tipo-desc" class="btn-micro">[ $ ] Fijo</button>
                    </div>
                    <input type="number" id="inp-descuento" value="0" min="0">
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="grupo-input" style="flex: 1;">
                    <label>Cantidad</label>
                    <input type="number" id="inp-cantidad" value="1" min="1">
                </div>
                <div class="grupo-input" style="flex: 2;">
                    <label style="color: var(--neon-azul);">Precio Neto Unitario ($)</label>
                    <input type="number" id="inp-precio-final" style="font-weight: bold; color: var(--neon-azul);">
                </div>
            </div>

            <button class="btn-neon" id="btn-agregar">+ Agregar al Carrito</button>
        </main>

        <section class="panel">
            <div class="switch-container" style="color: var(--neon-morado);">
                <span>Cotizar con IVA (16%)</span>
                <label class="switch">
                    <input type="checkbox" id="check-iva">
                    <span class="slider" style="border-color: rgba(188, 19, 254, 0.4);"></span>
                </label>
            </div>

            <ul id="lista-carrito"></ul>

            <div class="totales-caja">
                <div class="fila-total"><span>Subtotal Lista:</span> <span id="txt-subtotal">$0.00</span></div>
                <div class="fila-total" style="color: #ff3366;"><span>Ahorro Total:</span> <span id="txt-ahorro">-$0.00</span></div>
                <div class="fila-total"><span>Subtotal:</span> <span id="txt-subaplicado">$0.00</span></div>
                <div class="fila-total"><span>IVA (16%):</span> <span id="txt-iva">$0.00</span></div>
                <div class="fila-total gran-total"><span>TOTAL A PAGAR:</span> <span id="txt-total">$0.00</span></div>
            </div>

            <button class="btn-neon btn-secundario" id="btn-compartir">WhatsApp</button>
            <button class="btn-neon btn-pdf" id="btn-pdf">Generar PDF</button>
        </section>
    </div>

    <div id="pantalla-historial" class="pantalla">
        <div class="panel">
            <h3 style="color: var(--neon-morado); margin-bottom: 15px; text-align: center;">HISTORIAL</h3>
            <div id="contenedor-historial"></div>
            <button class="btn-neon" style="border-color: #ff3366; color: #ff3366; margin-top: 20px;" onclick="limpiarHistorial()">
                Borrar historial
            </button>
        </div>
    </div>

    <script>
        function crearChispa() {
            const c = document.createElement('div'); c.classList.add('chispa');
            c.style.width = `${Math.random() * 3 + 1}px`; c.style.height = c.style.width;
            c.style.left = `${Math.random() * 100}vw`; c.style.top = `${Math.random() * 100}vh`;
            c.style.setProperty('--dir-x', (Math.random() - 0.5) * 150 + 'px');
            c.style.setProperty('--dir-y', Math.random() * 150 + 'px');
            if(Math.random() > 0.7) { c.style.background = '#00f3ff'; c.style.boxShadow = '0 0 8px #00f3ff'; }
            c.style.animation = `volarChispa ${Math.random() * 1.5 + 0.5}s ease-in forwards`;
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 2000);
        }
        setInterval(crearChispa, 150);

        // BASE DE DATOS COMPLETA DE COLORES
        const db = {
            tambo: { capa: "Bicapa", capacidades: { "235L": { normal: 600, mayoreo: 550 } }, colores: ["Granito Beige", "Rojo", "Verde", "Azul", "Negro", "Blanco", "Café", "Azul/Blanco", "Rojo/Blanco", "Verde/Blanco", "Naranja/Blanco", "Terracota", "Oxford", "Natural"] },
            tinaco: { capa: "Tricapa", capacidades: { "750L": { normal: 1500, mayoreo: 1350 }, "1100L": { normal: 1600, mayoreo: 1400 }, "1200L": { normal: 1750, mayoreo: 1550 } }, colores: ["Beige", "Negro", "Rojo", "Azul", "Verde", "Naranja", "Café", "Blanco"] }
        };

        let carrito = [];
        let tipoDescuento = 'monto'; 
        let historialGuardado = JSON.parse(localStorage.getItem('plastinova_historial')) || [];

        const ui = {
            cliente: document.getElementById('inp-cliente'),
            asesor: document.getElementById('sel-asesor'),
            tipo: document.getElementById('sel-tipo'),
            capacidad: document.getElementById('sel-capacidad'),
            color: document.getElementById('sel-color'),
            colorOtro: document.getElementById('inp-color-otro'),
            mayoreo: document.getElementById('check-mayoreo'),
            precioBase: document.getElementById('inp-precio-base'),
            descuento: document.getElementById('inp-descuento'),
            btnTipoDesc: document.getElementById('btn-tipo-desc'),
            precioFinal: document.getElementById('inp-precio-final'),
            cantidad: document.getElementById('inp-cantidad'),
            iva: document.getElementById('check-iva')
        };

        function actualizarFormulario() {
            const data = db[ui.tipo.value];
            ui.capacidad.innerHTML = Object.keys(data.capacidades).map(c => `<option value="${c}">${c}</option>`).join('');
            ui.color.innerHTML = data.colores.map(c => `<option value="${c}">${c}</option>`).join('') + `<option value="otro">Otro (Manual)...</option>`;
            actualizarPrecio();
        }

        ui.color.addEventListener('change', () => {
            ui.colorOtro.style.display = ui.color.value === 'otro' ? 'block' : 'none';
        });

        function actualizarPrecio() {
            const val = db[ui.tipo.value].capacidades[ui.capacidad.value];
            ui.precioBase.value = ui.mayoreo.checked ? val.mayoreo : val.normal;
            calcularDesdeDescuento();
        }

        ui.btnTipoDesc.addEventListener('click', () => {
            tipoDescuento = tipoDescuento === 'monto' ? 'porcentaje' : 'monto';
            ui.btnTipoDesc.innerText = tipoDescuento === 'monto' ? '[ $ ] Fijo' : '[ % ] Porcent.';
            ui.btnTipoDesc.classList.toggle('activo-porcentaje', tipoDescuento === 'porcentaje');
            calcularDesdeDescuento();
        });

        function calcularDesdeDescuento() {
            let base = parseFloat(ui.precioBase.value) || 0;
            let desc = parseFloat(ui.descuento.value) || 0;
            if(tipoDescuento === 'porcentaje') ui.precioFinal.value = (base - (base * (desc / 100))).toFixed(2);
            else ui.precioFinal.value = (base - desc).toFixed(2);
        }

        ui.descuento.addEventListener('input', calcularDesdeDescuento);
        ui.precioFinal.addEventListener('input', () => {
            let base = parseFloat(ui.precioBase.value) || 0;
            let final = parseFloat(ui.precioFinal.value) || 0;
            if(tipoDescuento === 'monto') ui.descuento.value = (base - final).toFixed(2);
            else ui.descuento.value = (((base - final) / base) * 100).toFixed(2);
        });

        ui.tipo.addEventListener('change', actualizarFormulario);
        ui.capacidad.addEventListener('change', actualizarPrecio);
        ui.mayoreo.addEventListener('change', actualizarPrecio);
        ui.iva.addEventListener('change', renderizarTotales);

        document.getElementById('btn-agregar').addEventListener('click', () => {
            const bCat = db[ui.tipo.value].capacidades[ui.capacidad.value].normal;
            const final = parseFloat(ui.precioFinal.value);
            const cant = parseInt(ui.cantidad.value);
            // Captura de color normal o manual
            const colorFinal = ui.color.value === 'otro' ? ui.colorOtro.value : ui.color.value;

            carrito.push({
                id: Date.now(),
                nombre: `${ui.tipo.value === 'tinaco' ? 'Tinaco' : 'Tambo'} ${ui.capacidad.value} (${db[ui.tipo.value].capa})`,
                color: colorFinal || "N/A",
                cantidad: cant,
                precioNormal: bCat,
                precioAplicado: final,
                ahorroUnitario: bCat - final,
                importe: final * cant
            });
            renderizarCarrito();
        });

        function renderizarCarrito() {
            const lista = document.getElementById('lista-carrito');
            lista.innerHTML = carrito.map(item => `<li><b>${item.cantidad}x</b> ${item.nombre} <br> <span style="color:#8b9bb4;">Color: ${item.color}</span> <br> Importe: $${item.importe.toFixed(2)}<button class="btn-eliminar" onclick="eliminarItem(${item.id})">×</button></li>`).join('');
            renderizarTotales();
        }

        window.eliminarItem = id => { carrito = carrito.filter(i => i.id !== id); renderizarCarrito(); }

        let tG = 0;
        function renderizarTotales() {
            let sOri = 0, ahorro = 0, sNeto = 0;
            carrito.forEach(i => {
                sOri += (i.precioNormal * i.cantidad);
                ahorro += (i.ahorroUnitario * i.cantidad);
                sNeto += i.importe;
            });
            let ivaVal = ui.iva.checked ? sNeto * 0.16 : 0;
            tG = sNeto + ivaVal;
            document.getElementById('txt-subtotal').innerText = `$${sOri.toFixed(2)}`;
            document.getElementById('txt-ahorro').innerText = `-$${ahorro.toFixed(2)}`;
            document.getElementById('txt-subaplicado').innerText = `$${sNeto.toFixed(2)}`;
            document.getElementById('txt-iva').innerText = `$${ivaVal.toFixed(2)}`;
            document.getElementById('txt-total').innerText = `$${tG.toFixed(2)} MXN`;
        }

        // WHATSAPP
        document.getElementById('btn-compartir').addEventListener('click', () => {
            if(carrito.length === 0) return alert("Agregue productos.");
            const f = Math.floor(Math.random() * 9000) + 1000;
            const d = new Date().toLocaleDateString('es-MX');
            const c = ui.cliente.value || "Cliente General";
            const line = "-----------------------------------------";
            const drop = "\uD83D\uDCA7"; const user = "\uD83D\uDC64"; const clipboard = "\uD83D\uDCCB";
            const chart = "\uD83D\uDCCA"; const check = "\u2705"; const credit = "\uD83D\uDCB3"; const warn = "\u26A0\uFE0F";
            const square = "\u25A0"; 

            let txt = `${drop} *COTIZACIÓN PLASTINOVA*\nFolio: *#${f}*\nFecha: ${d}\n${line}\n${user} *Cliente:* ${c}\nAsesor: ${ui.asesor.value}\n${line}\n${clipboard} *DETALLE DE PRODUCTOS*\n\n`;

            let sL = 0, ah = 0, sN = 0;
            carrito.forEach(i => {
                txt += `${square} *${i.cantidad}x | ${i.nombre}*\nColor: ${i.color}\n`;
                if(i.ahorroUnitario > 0) {
                    txt += `Precio Lista: $${i.precioNormal.toFixed(2)}\n*Precio Aplicado:* $${i.precioAplicado.toFixed(2)} (Ahorro: $${i.ahorroUnitario.toFixed(2)} c/u)\n`;
                } else { txt += `Precio Unitario: $${i.precioAplicado.toFixed(2)}\n`; }
                txt += `Importe: $${i.importe.toFixed(2)}\n\n`;
                sL += (i.precioNormal * i.cantidad); ah += (i.ahorroUnitario * i.cantidad); sN += i.importe;
            });

            let iv = ui.iva.checked ? sN * 0.16 : 0;
            txt += `${line}\n${chart} *TOTALES*\nSubtotal lista: $${sL.toFixed(2)}\nAhorro aplicado: -$${ah.toFixed(2)}\nSubtotal: $${sN.toFixed(2)}\nIVA (16%): $${iv.toFixed(2)}\n${line}\n${check} *TOTAL A PAGAR: $${(sN + iv).toFixed(2)} MXN*\n${line}\n_${credit} Métodos de pago: Efectivo y Transferencia._\n_${warn} ${ui.iva.checked ? 'Cotización con IVA incluido.' : 'Si requiere factura, notifique para actualizar el cálculo del IVA.'}_`;

            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
            historialGuardado.unshift({ folio: f, fecha: d, cliente: c, asesor: ui.asesor.value, total: tG, iva: ui.iva.checked, items: [...carrito] });
            localStorage.setItem('plastinova_historial', JSON.stringify(historialGuardado));
        });

        // PDF PROFESIONAL - CORREGIDO PARA QUE NO SE ENCIME EL LOGO
        document.getElementById('btn-pdf').addEventListener('click', () => {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            const f = Math.floor(Math.random() * 9000) + 1000;
            const cl = ui.cliente.value || "Cliente General";
            
            const logo = new Image(); logo.src = 'logo.jpeg'; 
            try { doc.addImage(logo, 'JPEG', 15, 8, 35, 18); } catch(e){}

            // CAMBIO: El texto ahora empieza en X=55 para no tocar la imagen (que termina en X=50)
            doc.setFontSize(22); doc.setTextColor(200, 30, 30); doc.text("PLASTINOVA", 55, 18);
            doc.setFontSize(10); doc.setTextColor(100); doc.text("SOLUCIONES EN ALMACENAMIENTO", 55, 24);
            
            doc.setTextColor(40); doc.text(`FOLIO: #${f}`, 195, 20, { align: 'right' });
            doc.text(`FECHA: ${new Date().toLocaleDateString()}`, 195, 26, { align: 'right' });
            
            doc.setFillColor(245, 247, 250); doc.roundedRect(15, 35, 180, 22, 2, 2, 'F');
            doc.setTextColor(0); doc.setFont(undefined, 'bold');
            doc.text("CLIENTE:", 20, 42); doc.text("ASESOR:", 120, 42);
            doc.setFont(undefined, 'normal'); doc.text(cl.toUpperCase(), 20, 50); doc.text(ui.asesor.value.toUpperCase(), 120, 50);

            const body = carrito.map(i => [i.cantidad, i.nombre, i.color, `$${i.precioAplicado.toFixed(2)}`, `$${i.importe.toFixed(2)}`]);
            doc.autoTable({ startY: 65, head: [['CANT', 'DESCRIPCIÓN', 'COLOR', 'PRECIO U.', 'IMPORTE']], body: body, theme: 'grid', headStyles: { fillColor: [20, 90, 160] } });
            
            const fY = doc.lastAutoTable.finalY + 10;
            doc.text("SUBTOTAL:", 140, fY); doc.text(document.getElementById('txt-subaplicado').innerText, 195, fY, { align: 'right' });
            doc.text("IVA (16%):", 140, fY + 8); doc.text(document.getElementById('txt-iva').innerText, 195, fY + 8, { align: 'right' });
            doc.setFontSize(13); doc.setFont(undefined, 'bold');
            doc.text("TOTAL:", 140, fY + 18); doc.text(document.getElementById('txt-total').innerText, 195, fY + 18, { align: 'right' });
            doc.save(`Cotizacion_${cl}.pdf`);
        });

        function cambiarTab(t) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activo'));
            document.getElementById(`pantalla-${t}`).classList.add('activa');
            document.getElementById(`tab-btn-${t}`).classList.add('activo');
            if(t === 'historial') renderizarHistorial();
        }

        function renderizarHistorial() {
            const cont = document.getElementById('contenedor-historial');
            cont.innerHTML = historialGuardado.map(c => `<div class="tarjeta-historial"><div style="display:flex; justify-content:space-between; font-weight:bold;"><span>#${c.folio}</span><span>$${c.total.toFixed(2)}</span></div><div style="font-size:12px; color:#8b9bb4; margin:5px 0;">${c.cliente} - ${c.fecha}</div><button class="btn-accion-pequeno" onclick="cargarParaEdicion(${c.folio})">✏️ Abrir y Editar</button></div>`).join('') || '<p style="text-align:center;">Sin datos.</p>';
        }

        window.cargarParaEdicion = function(f) {
            const c = historialGuardado.find(i => i.folio === f); if(!c) return;
            ui.cliente.value = c.cliente; ui.asesor.value = c.asesor; ui.iva.checked = c.iva; carrito = [...c.items];
            renderizarCarrito(); cambiarTab('cotizador');
        }

        function limpiarHistorial() { if(confirm("¿Borrar todo?")) { localStorage.removeItem('plastinova_historial'); historialGuardado = []; renderizarHistorial(); } }
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(e => console.log(e)); });
        }

        actualizarFormulario();
    </script>
</body>
</html>
